name: CI

on:
  push:
  pull_request:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build PA2/PA2.fsproj -c Release

      - name: Run the simulator (20 peers, 5 lookups each; ~35 s incl. the 32 s stabilisation wait)
        shell: bash
        run: timeout 120 dotnet run --project PA2 -c Release --no-build -- 20 5 | tee run.log

      - name: Check that an average hop count was printed
        run: grep -q "The average hop count for 20 peers and 5 requests is" run.log
